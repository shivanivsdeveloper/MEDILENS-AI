version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediscan-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./outputs:/app/outputs
      - ./models:/app/models
    environment:
      - DATABASE_URL=sqlite:///./data/mediscan.db
      - ENVIRONMENT=production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediscan-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
